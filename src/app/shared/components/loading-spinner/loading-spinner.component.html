<div
  role="status"
  [attr.aria-label]="loadingLabel()"
  [class]="compact() ? 'flex items-center justify-center' : 'flex items-center justify-center py-20'"
>
  <span
    class="h-12 w-12 animate-spin rounded-full border-4 border-accent border-t-transparent"
  ></span>
  <span class="sr-only">{{ loadingLabel() }}</span>
</div>
