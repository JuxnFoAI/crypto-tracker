<div role="search" class="relative">
  <svg
    class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-400 dark:text-gray-500"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="m21 21-4.35-4.35M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"
    />
  </svg>
  <input
    type="search"
    [formControl]="searchControl"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    class="w-full rounded-xl bg-white py-3 pl-10 pr-4 text-base text-gray-900 placeholder-gray-400 ring-1 ring-gray-200 transition focus:outline-none focus:ring-2 focus:ring-accent sm:py-2.5 sm:text-sm dark:bg-bg-card dark:text-white dark:placeholder-gray-500 dark:ring-white/5"
  />
</div>
