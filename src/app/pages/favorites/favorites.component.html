<main class="min-h-screen px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <header class="mb-6 sm:mb-8">
      <h1 class="text-2xl font-bold text-gray-900 sm:text-3xl dark:text-white">
        {{ t().favorites.title }}
      </h1>
      <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
        {{ t().favorites.subtitle }}
      </p>
    </header>

    @switch (state()) {
      @case ('loading') {
        <app-loading-spinner [loadingLabel]="t().common.loading" />
      }
      @case ('error') {
        <app-error-state
          [message]="errorMessage()"
          [retryLabel]="t().common.retry"
          (retry)="retry()"
        />
      }
      @case ('success') {
        @if (favoriteCoins().length === 0) {
          <div
            class="mx-auto flex max-w-md animate-fade-in flex-col items-center gap-4 rounded-xl bg-white p-10 text-center ring-1 ring-gray-200 dark:bg-bg-card dark:ring-white/5"
          >
            <app-star-icon size="lg" class="text-gray-300 dark:text-gray-600" />
            <div>
              <h2 class="text-base font-semibold text-gray-900 dark:text-white">
                {{ t().favorites.emptyTitle }}
              </h2>
              <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
                {{ t().favorites.emptyText }}
              </p>
            </div>
            <a
              routerLink="/"
              class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white transition hover:bg-accent/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-gray-50 dark:focus-visible:ring-offset-bg-primary"
            >
              {{ t().favorites.exploreCta }}
            </a>
          </div>
        } @else {
          <app-coin-grid
            [coins]="favoriteCoins()"
            [translations]="t()"
            [listLabel]="t().favorites.listLabel"
            [isFavorite]="isFavorite"
            (favoriteToggled)="onFavoriteToggled($event)"
          />
        }
      }
    }
  </div>
</main>
