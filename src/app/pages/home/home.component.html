<main class="min-h-screen px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <header class="mb-6 sm:mb-8">
      <h1 class="text-2xl font-bold text-gray-900 sm:text-3xl dark:text-white">
        {{ t().home.title }}
      </h1>
      <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
        {{ t().home.subtitle }}
      </p>
    </header>

    @switch (state()) {
      @case ('loading') {
        <app-loading-spinner />
      }
      @case ('error') {
        <app-error-state
          [message]="errorMessage()"
          [retryLabel]="t().common.retry"
          (retry)="retry()"
        />
      }
      @case ('success') {
        <app-search-bar (searchChanged)="onSearchChanged($event)" class="mb-6 block" />

        @if (filteredCoins().length === 0) {
          <p role="status" class="py-16 text-center text-sm text-gray-500 dark:text-gray-400">
            {{ t().home.noResults }}
          </p>
        } @else {
          <section
            [attr.aria-label]="t().home.listLabel"
            class="grid animate-fade-in grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 md:grid-cols-3 xl:grid-cols-4"
          >
            @for (coin of filteredCoins(); track coin.id) {
              <app-coin-card
                [coin]="coin"
                [isFavorite]="isFavorite(coin.id)"
                [translations]="t()"
                (favoriteToggled)="onFavoriteToggled($event)"
              />
            }
          </section>
        }
      }
    }
  </div>
</main>
